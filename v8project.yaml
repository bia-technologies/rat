# yaml-language-server: $schema=https://raw.githubusercontent.com/alkoleft/v8-runner-rust/refs/heads/master/docs/schemas/v8project.schema.json
workPath: 'build'
execution_timeout: 300000
format: EDT
builder: DESIGNER
infobase:
  connection: 'File=build/ib'
source-set:
  - name: 'configuration'
    type: CONFIGURATION
    path: 'fixtures/configuration'

  - name: 'RAT'
    type: EXTENSION
    path: 'exts/rat'

  - name: 'tests'
    type: EXTENSION
    path: 'tests'

tools:
  platform:
    version: '8.3.27'
  client_mcp:
    port: 9874
build:
  partialLoadThreshold: 20
tests:
  execution_timeout_seconds: 900
  va:
    params_path: 'VAParams.json'
    profile: generator
    fail_fast: true
    profiles:
      generator:
        feature_path: 'features_scenario'
